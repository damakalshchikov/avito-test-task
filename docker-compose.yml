services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 3s
      timeout: 3s
      retries: 20

  kitchen:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KITCHEN_HTTP_ADDR: ":8080"
      KITCHEN_DATABASE_URL: postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable
      KITCHEN_ADMIN_TOKEN: ${KITCHEN_ADMIN_TOKEN:-dev-admin-token}
      KITCHEN_LOG_LEVEL: ${KITCHEN_LOG_LEVEL:-info}
      KITCHEN_OUTBOX_POLL_INTERVAL: ${KITCHEN_OUTBOX_POLL_INTERVAL:-1s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
